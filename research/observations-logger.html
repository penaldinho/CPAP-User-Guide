<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Observations Logger</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f4f6fb; color: #1f2937; }
    .wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #dbe2ef; border-radius: 10px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 14px; color: #4b5563; }
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .full { grid-column: 1 / -1; }
    label { display: grid; gap: 5px; font-size: 14px; }
    input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 11px; font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    .row-action { display: grid; gap: 8px; grid-template-columns: 1fr auto; align-items: end; }
    .task-timer { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 11px; background: #f8fafc; font-weight: 600; font-size: 14px; color: #0f172a; }
    button { border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; border-radius: 8px; padding: 9px 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    button.secondary { background: #fff; color: #1d4ed8; }
    #status { margin-top: 12px; font-size: 14px; }
    .ok { color: #065f46; }
    .err { color: #991b1b; }
    .meta { font-size: 12px; color: #6b7280; margin-top: 8px; }
    .hidden { display: none; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .row-action { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Observations Logger</h1>
      <p>Log observer page marks, scenario scores, and notes during physical-manual trials.</p>

      <div class="grid">
        <label>
          Participant ID
          <input id="participant_id" type="text" placeholder="e.g. P01" required />
        </label>
        <label>
          Task ID
          <select id="task_id" required>
            <option value="">Select task ID</option>
            <option value="scenario_card_1">scenario_card_1</option>
            <option value="scenario_card_2">scenario_card_2</option>
            <option value="scenario_card_3">scenario_card_3</option>
            <option value="short_form_q1">short_form_q1</option>
            <option value="short_form_q2">short_form_q2</option>
            <option value="short_form_q3">short_form_q3</option>
            <option value="short_form_q4">short_form_q4</option>
            <option value="__custom__">Custom task…</option>
          </select>
        </label>
        <label>
          Task Label
          <select id="task_label">
            <option value="">Select task label</option>
            <option value="Scenario Card 1 – First-Time Setup (Setup)">Scenario Card 1 – First-Time Setup (Setup)</option>
            <option value="Scenario Card 2 – Fit and Start Therapy (Routine Use)">Scenario Card 2 – Fit and Start Therapy (Routine Use)</option>
            <option value="Scenario Card 3 – Comfort Adjustment (Troubleshooting)">Scenario Card 3 – Comfort Adjustment (Troubleshooting)</option>
            <option value="Short-Form Q1 – Cleaning frequency (Routine Use)">Short-Form Q1 – Cleaning frequency (Routine Use)</option>
            <option value="Short-Form Q2 – Error message safety escalation (Error 006)">Short-Form Q2 – Error message safety escalation (Error 006)</option>
            <option value="Short-Form Q3 – Spare mask storage (Routine Use / Safety)">Short-Form Q3 – Spare mask storage (Routine Use / Safety)</option>
            <option value="Short-Form Q4 – Tubing length check (Setup)">Short-Form Q4 – Tubing length check (Setup)</option>
            <option value="__custom__">Custom task…</option>
          </select>
        </label>
        <label class="hidden" id="custom_task_id_wrap">
          Custom Task ID
          <input id="task_id_custom" type="text" placeholder="e.g. task_custom_1" />
        </label>
        <label class="hidden" id="custom_task_label_wrap">
          Custom Task Label
          <input id="task_label_custom" type="text" placeholder="e.g. Additional scenario" />
        </label>

        <div class="row-action full">
          <div class="task-timer" id="task_timer">Task timer: 00:00</div>
          <div style="display:flex; gap:8px;">
            <button id="btn-start" type="button">Start Task</button>
            <button id="btn-end" type="button" class="secondary">End Task</button>
          </div>
        </div>

        <div class="row-action full">
          <label style="margin:0;">
            Manual Page (optional)
            <input id="manual_page" type="text" placeholder="e.g. 23" />
          </label>
          <button id="btn-page" type="button" class="secondary">Log Page Mark</button>
        </div>

        <div class="row-action full">
          <label style="margin:0;">
            Scenario Score
            <select id="scenario_score">
              <option value="">Select score</option>
              <option value="0">0 - Failed</option>
              <option value="1">1 - Completed with help/errors</option>
              <option value="2">2 - Completed without help/errors</option>
            </select>
          </label>
          <button id="btn-score" type="button">Enter Score</button>
        </div>

        <label class="full">
          Notes
          <textarea id="notes" placeholder="Observer notes"></textarea>
        </label>
      </div>

      <div style="margin-top:10px;">
        <button id="btn-note" type="button" class="secondary">Log Note</button>
      </div>

      <div id="status" aria-live="polite"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <script>
    (function () {
      const host = window.location.hostname;
      const isLocalHost = host === 'localhost' || host === '127.0.0.1';
      const isHostedChat = /(^|\.)chat\.medtechguides\.uk$/i.test(host);
      const endpoint = (isLocalHost || isHostedChat)
        ? '/api/observer-notes'
        : 'https://chat.medtechguides.uk/api/observer-notes';
      const sessionKey = 'observer-notes-session-id';
      const activeTaskKey = 'observer-notes-active-task';

      const el = (id) => document.getElementById(id);
      const participantInput = el('participant_id');
      const taskIdSelect = el('task_id');
      const taskLabelSelect = el('task_label');
      const taskIdCustomInput = el('task_id_custom');
      const taskLabelCustomInput = el('task_label_custom');
      const customTaskIdWrap = el('custom_task_id_wrap');
      const customTaskLabelWrap = el('custom_task_label_wrap');
      const manualPageInput = el('manual_page');
      const scenarioScoreSelect = el('scenario_score');
      const taskTimerEl = el('task_timer');
      const notesInput = el('notes');
      const statusEl = el('status');
      const metaEl = el('meta');
      const CUSTOM_TASK_VALUE = '__custom__';
      const presetTaskPairs = [
        ['scenario_card_1', 'Scenario Card 1 – First-Time Setup (Setup)'],
        ['scenario_card_2', 'Scenario Card 2 – Fit and Start Therapy (Routine Use)'],
        ['scenario_card_3', 'Scenario Card 3 – Comfort Adjustment (Troubleshooting)'],
        ['short_form_q1', 'Short-Form Q1 – Cleaning frequency (Routine Use)'],
        ['short_form_q2', 'Short-Form Q2 – Error message safety escalation (Error 006)'],
        ['short_form_q3', 'Short-Form Q3 – Spare mask storage (Routine Use / Safety)'],
        ['short_form_q4', 'Short-Form Q4 – Tubing length check (Setup)']
      ];
      const labelById = Object.fromEntries(presetTaskPairs);
      const idByLabel = Object.fromEntries(presetTaskPairs.map(([id, label]) => [label, id]));

      const makeSessionId = () => `obs_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      const getSessionId = () => {
        let id = localStorage.getItem(sessionKey);
        if (!id) {
          id = makeSessionId();
          localStorage.setItem(sessionKey, id);
        }
        return id;
      };

      const setStatus = (text, ok) => {
        statusEl.textContent = text;
        statusEl.className = ok ? 'ok' : 'err';
      };

      const formatDuration = (durationMs) => {
        const totalSeconds = Math.max(0, Math.floor((durationMs || 0) / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      };

      const isCustomTask = () => taskIdSelect.value === CUSTOM_TASK_VALUE || taskLabelSelect.value === CUSTOM_TASK_VALUE;

      const syncCustomTaskVisibility = () => {
        const showCustom = isCustomTask();
        customTaskIdWrap.classList.toggle('hidden', !showCustom);
        customTaskLabelWrap.classList.toggle('hidden', !showCustom);
      };

      const getTaskIdValue = () => {
        if (isCustomTask()) {
          return String(taskIdCustomInput.value || '').trim();
        }
        return String(taskIdSelect.value || '').trim();
      };

      const getTaskLabelValue = () => {
        if (isCustomTask()) {
          return String(taskLabelCustomInput.value || '').trim();
        }
        return String(taskLabelSelect.value || '').trim();
      };

      const getCurrentTaskKey = () => {
        const participantId = String(participantInput.value || '').trim();
        const taskId = getTaskIdValue();
        return `${participantId}::${taskId}`;
      };

      const getActiveTaskState = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(activeTaskKey) || '{}');
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      };

      const setActiveTaskState = (state) => {
        localStorage.setItem(activeTaskKey, JSON.stringify(state || {}));
      };

      const clearActiveTaskState = () => {
        localStorage.removeItem(activeTaskKey);
      };

      const updateTaskTimer = () => {
        if (!taskTimerEl) return;
        const active = getActiveTaskState();
        const expectedKey = getCurrentTaskKey();
        const startedAtMs = Date.parse(String(active.started_at || ''));
        if (!active || !active.key || active.key !== expectedKey || !Number.isFinite(startedAtMs)) {
          taskTimerEl.textContent = 'Task timer: 00:00';
          return;
        }
        taskTimerEl.textContent = `Task timer: ${formatDuration(Date.now() - startedAtMs)}`;
      };

      const syncFromTaskId = () => {
        if (taskIdSelect.value === CUSTOM_TASK_VALUE) {
          taskLabelSelect.value = CUSTOM_TASK_VALUE;
          syncCustomTaskVisibility();
          return;
        }
        const matchingLabel = labelById[taskIdSelect.value] || '';
        if (matchingLabel) taskLabelSelect.value = matchingLabel;
        syncCustomTaskVisibility();
      };

      const syncFromTaskLabel = () => {
        if (taskLabelSelect.value === CUSTOM_TASK_VALUE) {
          taskIdSelect.value = CUSTOM_TASK_VALUE;
          syncCustomTaskVisibility();
          return;
        }
        const matchingId = idByLabel[taskLabelSelect.value] || '';
        if (matchingId) taskIdSelect.value = matchingId;
        syncCustomTaskVisibility();
      };

      const validateCommon = () => {
        if (!String(participantInput.value || '').trim()) {
          setStatus('Participant ID is required.', false);
          participantInput.focus();
          return false;
        }

        const selectedTaskId = getTaskIdValue();
        if (!selectedTaskId) {
          setStatus('Task ID is required.', false);
          if (isCustomTask()) {
            taskIdCustomInput.focus();
          } else {
            taskIdSelect.focus();
          }
          return false;
        }

        return true;
      };

      const submitObservation = async (actionType) => {
        if (!validateCommon()) return;

        const taskId = getTaskIdValue();
        const manualPage = String(manualPageInput.value || '').trim();
        const notes = String(notesInput.value || '').trim();
        const scenarioScoreRaw = String(scenarioScoreSelect.value || '').trim();

        if (actionType === 'page_mark' && !manualPage) {
          setStatus('Enter a manual page before logging a page mark.', false);
          manualPageInput.focus();
          return;
        }

        if (actionType === 'scenario_score') {
          if (!/^scenario_card_\d+$/i.test(taskId)) {
            setStatus('Scenario score can only be entered for scenario tasks.', false);
            taskIdSelect.focus();
            return;
          }
          if (!['0', '1', '2'].includes(scenarioScoreRaw)) {
            setStatus('Select a scenario score (0, 1, or 2).', false);
            scenarioScoreSelect.focus();
            return;
          }
        }

        if (actionType === 'note' && !notes) {
          setStatus('Enter notes before logging a note.', false);
          notesInput.focus();
          return;
        }

        const active = getActiveTaskState();
        const currentKey = getCurrentTaskKey();
        const startedAtMs = Date.parse(String(active.started_at || ''));
        const taskLengthMs = actionType === 'task_end' && active.key === currentKey && Number.isFinite(startedAtMs)
          ? Math.max(0, Date.now() - startedAtMs)
          : null;

        const payload = {
          timestamp: new Date().toISOString(),
          session_id: getSessionId(),
          participant_id: String(participantInput.value || '').trim(),
          task_id: taskId,
          task_label: getTaskLabelValue(),
          manual_page: manualPage,
          scenario_score: actionType === 'scenario_score' ? Number.parseInt(scenarioScoreRaw, 10) : null,
          task_length_ms: taskLengthMs,
          notes,
          action_type: actionType,
          source: 'observations_logger',
          trial_mode: 'physical'
        };

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            let message = 'Failed to log observation.';
            try {
              const data = await response.json();
              if (data && data.error) message = data.error;
            } catch {}
            throw new Error(message);
          }

          setStatus(`Logged ${actionType} for ${payload.participant_id} (${payload.task_id}).`, true);
          metaEl.textContent = `Session: ${payload.session_id} • Last event at ${new Date(payload.timestamp).toLocaleString()}`;

          if (actionType === 'task_start') {
            setActiveTaskState({
              key: currentKey,
              participant_id: payload.participant_id,
              task_id: payload.task_id,
              started_at: payload.timestamp
            });
          }

          if (actionType === 'task_end') {
            clearActiveTaskState();
          }

          updateTaskTimer();
        } catch (error) {
          setStatus(error.message || 'Failed to log observation.', false);
        }
      };

      const startTask = async () => {
        if (!validateCommon()) return;
        await submitObservation('task_start');
      };

      const endTask = async () => {
        if (!validateCommon()) return;

        const active = getActiveTaskState();
        const currentKey = getCurrentTaskKey();
        if (!active.key || active.key !== currentKey) {
          setStatus('No active task timer found for this participant/task. Start the task first.', false);
          return;
        }

        await submitObservation('task_end');
      };

      el('btn-start').addEventListener('click', startTask);
      el('btn-end').addEventListener('click', endTask);
      el('btn-page').addEventListener('click', () => submitObservation('page_mark'));
      el('btn-score').addEventListener('click', () => submitObservation('scenario_score'));
      el('btn-note').addEventListener('click', () => submitObservation('note'));

      taskIdSelect.addEventListener('change', syncFromTaskId);
      taskLabelSelect.addEventListener('change', syncFromTaskLabel);
      participantInput.addEventListener('input', updateTaskTimer);
      taskIdSelect.addEventListener('change', updateTaskTimer);
      taskIdCustomInput.addEventListener('input', updateTaskTimer);

      metaEl.textContent = `Session: ${getSessionId()}`;
      syncCustomTaskVisibility();
      updateTaskTimer();
      window.setInterval(updateTaskTimer, 1000);
    })();
  </script>
</body>
</html>
